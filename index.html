<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B7A75">
<title>OralGuard: oral cancer screening and prevention (prototype)</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦷</text></svg>">
<style>
:root{
  --bg:#F3F6F6;--surface:#fff;--ink:#142629;--mut:#56676B;--line:#D5DEDF;--line2:#E6ECEC;
  --teal:#0B7A75;--teal-d:#075A56;--tealbg:#E3F1F0;
  --rose:#C2415B;--rosebg:#FBEAEE;
  --green:#1E7F4F;--greenbg:#E6F4EC;--amber:#A35C00;--amberbg:#FFF4E0;--red:#B42318;--redbg:#FDECEA;
  --viewer:#0F1E21;
  --r1:6px;--r2:10px;--r3:14px;
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Sans Bengali","Noto Naskh Arabic","Noto Nastaliq Urdu","Noto Sans Devanagari",Arial,sans-serif;color:var(--ink);background:var(--bg);font-variant-numeric:tabular-nums}
h1,h2,h3{line-height:1.25;letter-spacing:-.01em;font-weight:680}
h1{font-size:1.6rem;margin:.1em 0 .5em}h2{font-size:1.2rem;margin:1.1em 0 .45em}h3{font-size:1.02rem;margin:.9em 0 .35em}
p{margin:.4em 0 .8em}
a{color:var(--teal-d)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid #1a5fd0;outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.skip{position:absolute;left:-999px;top:0;z-index:99}.skip:focus{left:8px;background:#fff;padding:8px}

/* Banner + top bar */
#banner{background:#FFF4CC;color:#5A4200;border-bottom:1px solid #E5C24A;padding:6px 12px;font-size:.88rem;font-weight:600;text-align:center}
#top{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--line);padding:8px 14px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px}
.brand{display:flex;align-items:center;gap:10px;font-weight:750;font-size:1.12rem;color:var(--teal-d)}
.brand svg{flex:none}
.brand small{display:block;font-weight:500;font-size:.78rem;color:var(--mut);letter-spacing:0}
#who{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:.92rem}

/* Layout */
#layout{display:block}
#nav{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--line);display:flex;overflow-x:auto;z-index:25;padding-bottom:env(safe-area-inset-bottom,0px)}
#nav button{flex:1 0 auto;min-width:76px;min-height:58px;line-height:1.15;border:0;background:none;font-size:.74rem;color:var(--mut);padding:6px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
#nav button svg{width:22px;height:22px}
#nav button.on{color:var(--teal-d);font-weight:700;box-shadow:inset 0 3px 0 var(--teal)}
#nav .cnt{background:var(--rose);color:#fff;border-radius:999px;font-size:.68rem;padding:0 6px;font-weight:700}
main{padding:16px 14px 100px;max-width:1080px;margin:0 auto}
@media(min-width:880px){
  #layout{display:flex;min-height:calc(100vh - 90px)}
  #nav{position:sticky;top:57px;align-self:flex-start;height:calc(100vh - 57px);flex-direction:column;width:228px;border-top:0;border-right:1px solid var(--line);padding:12px 10px;overflow:auto;background:var(--surface)}
  #nav button{flex:0 0 auto;flex-direction:row;justify-content:flex-start;gap:12px;text-align:left;font-size:.98rem;border-radius:var(--r2);min-height:46px;padding:8px 12px}
  #nav button.on{background:var(--tealbg);box-shadow:none}
  #nav .grp{font-size:.78rem;color:var(--mut);padding:14px 12px 4px;font-weight:600}
  main{flex:1;padding:24px 30px 60px;margin:0;max-width:1100px}
}
#nav .grp{display:none}
@media(min-width:880px){#nav .grp{display:block}}

/* Surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r3);padding:16px;margin-bottom:14px}
.card>h2:first-child,.card>h3:first-child{margin-top:0}
.sub{background:#F8FAFA;border:1px solid var(--line2);border-radius:var(--r2);padding:12px;margin:10px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.grid2{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:880px){.grid2{grid-template-columns:1fr 1fr}.grid2.w{grid-template-columns:1.25fr 1fr}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r3);padding:14px 16px}
.kpi b{display:block;font-size:1.85rem;line-height:1.1;color:var(--teal-d);font-weight:720}
.kpi span{color:var(--mut);font-size:.92rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sp{justify-content:space-between}
.help{color:var(--mut);font-size:.93rem;margin:.2em 0 .6em}
.tiny{font-size:.82rem;color:var(--mut)}
hr{border:0;border-top:1px solid var(--line2);margin:14px 0}

/* Buttons */
.btn{min-height:46px;padding:9px 16px;border-radius:var(--r2);border:1px solid var(--teal);background:var(--surface);color:var(--teal-d);font-weight:640;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn:hover{background:var(--tealbg)}
.btn.p{background:var(--teal);color:#fff}.btn.p:hover{background:var(--teal-d)}
.btn.q{border-color:var(--line);color:var(--ink)}
.btn.d{border-color:var(--red);color:var(--red)}
.btn.sm{min-height:38px;padding:5px 12px;font-size:.92rem}
.btn.big{width:100%;min-height:58px;font-size:1.1rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg{width:20px;height:20px;flex:none}
.lnk{background:none;border:0;color:var(--teal-d);cursor:pointer;text-decoration:underline;padding:8px 4px;min-height:40px}

/* Forms */
label.f{display:block;font-weight:620;margin:14px 0 5px}
input[type=text],input[type=number],input[type=date],input[type=url],select,textarea{width:100%;min-height:46px;padding:9px 11px;border:1px solid #8A9A9E;border-radius:var(--r1);background:#fff}
textarea{min-height:84px}
input[type=checkbox],input[type=radio]{width:24px;height:24px;accent-color:var(--teal);flex:none;margin:0}
input[type=range]{width:100%;accent-color:var(--teal);min-height:40px}
.chk{display:flex;gap:12px;align-items:flex-start;padding:9px 0;cursor:pointer}
.chk+.chk{border-top:1px solid var(--line2)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1 1 0;min-width:72px;min-height:44px;border:1px solid #8A9A9E;background:#fff;border-radius:var(--r1);cursor:pointer;padding:6px 10px}
.seg button.on{background:var(--teal);color:#fff;border-color:var(--teal);font-weight:680}
.fgrid{display:grid;grid-template-columns:1fr;gap:0 16px}
@media(min-width:640px){.fgrid{grid-template-columns:1fr 1fr}}
.qrow{display:grid;grid-template-columns:1fr;gap:6px;padding:12px 0;border-bottom:1px solid var(--line2)}
@media(min-width:700px){.qrow{grid-template-columns:1.2fr 1fr;align-items:center}}
.qrow:last-child{border-bottom:0}
.qrow b{display:block}

/* Notes */
.note{background:var(--amberbg);border:1px solid #E7B45E;border-radius:var(--r2);padding:10px 12px;margin:10px 0}
.warn{background:var(--redbg);border:1px solid #E5A29B;border-radius:var(--r2);padding:10px 12px;margin:10px 0}
.ok{background:var(--greenbg);border:1px solid #9BCDB0;border-radius:var(--r2);padding:10px 12px;margin:10px 0}
.info{background:var(--tealbg);border:1px solid #A9D3D0;border-radius:var(--r2);padding:10px 12px;margin:10px 0}
.disc{border-left:4px solid var(--teal);padding:8px 12px;background:var(--tealbg);margin:14px 0;font-weight:640;border-radius:0 var(--r1) var(--r1) 0}
.note ul,.warn ul,.info ul,.ok ul{margin:.3em 0 0;padding-left:1.2em}

/* Chips and status */
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:1px 10px;background:#E8EEEF;font-size:.84rem;margin:2px 2px 2px 0;white-space:nowrap}
.chip.r{background:var(--redbg);color:var(--red)}.chip.a{background:var(--amberbg);color:var(--amber)}.chip.g{background:var(--greenbg);color:var(--green)}.chip.t{background:var(--tealbg);color:var(--teal-d)}.chip.ro{background:var(--rosebg);color:var(--rose)}
.tier{display:flex;align-items:center;gap:14px;border-radius:var(--r3);padding:16px 18px;color:#fff}
.tier .ic{font-size:2rem;line-height:1}
.tier b{font-size:1.5rem;display:block;line-height:1.2}
.tier span{font-size:.95rem;opacity:.95}

/* Stepper */
.steps{display:flex;gap:4px;margin:4px 0 16px;overflow-x:auto;padding-bottom:2px}
.steps div{flex:1 0 auto;min-width:64px;font-size:.78rem;color:var(--mut);border-top:4px solid var(--line);padding-top:5px}
.steps div.on{color:var(--teal-d);border-color:var(--teal);font-weight:700}
.steps div.done{border-color:#7FBDB9;color:var(--ink)}
.wiznav{display:flex;gap:10px;justify-content:space-between;margin-top:6px;position:sticky;bottom:70px;background:linear-gradient(transparent,var(--bg) 30%);padding:14px 0 6px;z-index:5}
@media(min-width:880px){.wiznav{bottom:0}}

/* Photo capture and viewer */
.capgrid{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:640px){.capgrid{grid-template-columns:repeat(3,1fr)}}
.capbtn{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;padding:14px;border:1.5px solid var(--teal);border-radius:var(--r3);background:#fff;cursor:pointer;min-height:96px}
.capbtn:hover{background:var(--tealbg)}
.capbtn b{color:var(--teal-d);font-size:1.02rem}
.capbtn span{font-size:.86rem;color:var(--mut)}
.capbtn svg{width:28px;height:28px;color:var(--teal)}
.drop{border:2px dashed #9DB3B5;border-radius:var(--r3);padding:16px;text-align:center;color:var(--mut);margin-top:10px}
.drop.over{border-color:var(--teal);background:var(--tealbg)}
.viewer{background:var(--viewer);border-radius:var(--r3);padding:10px;color:#DCE7E8}
.viewer .stage{position:relative;display:flex;justify-content:center;align-items:center;min-height:200px}
.viewer img,.viewer canvas{max-width:100%;max-height:62vh;display:block;border-radius:6px}
.viewer .bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:8px 2px 2px}
.viewer .btn{background:transparent;color:#E8F2F2;border-color:#3D5A5E}
.viewer .btn:hover{background:#1B3236}
.viewer .btn.on{background:var(--rose);border-color:var(--rose);color:#fff}
.viewer .btn.p{background:var(--teal);border-color:var(--teal)}
.viewer select{background:#1B3236;color:#fff;border-color:#3D5A5E;min-height:38px;width:auto}
.viewer label{color:#C9D8DA}
.viewer .chip{color:var(--ink)}
.bl{display:none}@media(max-width:640px){.bs{display:none}.bl{display:inline}}
#camwrap video{width:100%;max-height:60vh;background:#000;border-radius:6px;display:block}
#camwrap.mirror video{transform:scaleX(-1)}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.thumb{position:relative;border:3px solid transparent;border-radius:10px;padding:0;background:none;cursor:pointer}
.thumb[aria-pressed=true]{border-color:var(--teal)}
.thumb img{width:92px;height:72px;object-fit:cover;border-radius:7px;display:block}
.thumb i{position:absolute;right:4px;bottom:4px;font-style:normal;font-size:.7rem;background:#000a;color:#fff;border-radius:4px;padding:0 4px}
.qual{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.annwrap{position:relative;touch-action:none;user-select:none;-webkit-user-select:none;line-height:0}
.annwrap canvas{touch-action:none;cursor:crosshair}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:.84rem}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.shape-list{list-style:none;padding:0;margin:8px 0}
.shape-list li{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px solid #2A4246}

/* Result */
.gauge{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.pbar{display:grid;grid-template-columns:86px 1fr 92px;align-items:center;gap:8px;margin:7px 0}
.pbar .tr{position:relative;height:14px;background:#E6ECEC;border-radius:999px;overflow:hidden}
.pbar .tr i{position:absolute;left:0;top:0;bottom:0;border-radius:999px}
.pbar .tr s{position:absolute;top:0;bottom:0;background:#0003;text-decoration:none}
.pbar b{text-align:right;font-size:.95rem}
.contrib{display:grid;grid-template-columns:minmax(120px,1.2fr) 1fr 56px;align-items:center;gap:8px;margin:6px 0;font-size:.93rem}
.contrib .tr{height:10px;background:#EEF2F2;border-radius:999px;overflow:hidden}
.contrib .tr i{display:block;height:100%;background:var(--teal)}
.contrib .tr i.n{background:#8A9A9E}
.path{list-style:none;padding:0;margin:0;counter-reset:s}
.path li{position:relative;padding:10px 0 10px 42px;border-bottom:1px solid var(--line2)}
.path li:last-child{border-bottom:0}
.path li::before{counter-increment:s;content:counter(s);position:absolute;left:0;top:10px;width:28px;height:28px;border-radius:50%;background:var(--tealbg);color:var(--teal-d);font-weight:700;display:flex;align-items:center;justify-content:center;font-size:.9rem}
.path b{display:block}

/* Tables */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.t{border-collapse:collapse;width:100%;background:#fff;font-size:.95rem}
.t th,.t td{border-bottom:1px solid var(--line2);padding:9px 8px;text-align:left;white-space:nowrap;vertical-align:middle}
.t th{font-weight:640;color:var(--mut);font-size:.86rem;background:#F8FAFA}
.t tbody tr.cl{cursor:pointer}.t tbody tr.cl:hover{background:var(--tealbg)}
.t td.num,.t th.num{text-align:right}
.t tr.grp td{background:var(--tealbg);font-weight:700}
.sup{color:var(--mut)}

/* Drawer + dialog */
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:#fff;border-left:1px solid var(--line);box-shadow:-8px 0 24px #0002;overflow:auto;padding:16px 16px 90px;z-index:60}
#scrim{position:fixed;inset:0;background:#0006;z-index:55}
.dlg{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0007;z-index:70;padding:14px}
.dlg .card{max-width:620px;width:100%;max-height:90vh;overflow:auto;margin:0}
#toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:var(--r2);z-index:90;font-weight:600;max-width:92vw}
@media(min-width:880px){#toast{bottom:24px}}

/* Paper (letters / cards) */
.paper{background:#fff;padding:26px;line-height:1.6;border:1px solid var(--line);border-radius:4px;max-width:780px}
.paper td{padding:4px 14px 4px 0;vertical-align:top}
.pc-item{border-left:4px solid var(--teal);background:#F6FAFA;padding:8px 12px;margin:8px 0;border-radius:0 6px 6px 0}
[dir=rtl] .pc-item{border-left:0;border-right:4px solid var(--teal);border-radius:6px 0 0 6px}

/* Role picker */
.roles{display:grid;gap:12px;grid-template-columns:1fr;max-width:820px;margin:18px auto}
@media(min-width:700px){.roles{grid-template-columns:1fr 1fr}}
.role{display:flex;gap:14px;align-items:flex-start;text-align:left;padding:16px;border:1px solid var(--line);border-radius:var(--r3);background:#fff;cursor:pointer}
.role:hover{border-color:var(--teal);background:#FBFDFD}
.role svg{width:34px;height:34px;color:var(--teal);flex:none}
.role b{display:block;font-size:1.08rem}
.role span{color:var(--mut);font-size:.92rem}
.hero{max-width:820px;margin:8px auto 0}
.hero h1{font-size:1.9rem}

.svgc text{font-family:inherit}
.bar-h{display:grid;grid-template-columns:130px 1fr 70px;gap:8px;align-items:center;margin:5px 0;font-size:.92rem}
.bar-h .tr{height:14px;background:#EEF2F2;border-radius:4px;overflow:hidden}
.bar-h .tr i{display:block;height:100%;background:var(--teal)}
.bar-h .tr i.g{background:#9AA8AB}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:0 0 14px;overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;min-height:44px;cursor:pointer;color:var(--mut);border-bottom:3px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--teal-d);border-color:var(--teal);font-weight:700}
.audit{font-size:.88rem}
.audit td{white-space:normal}

@media print{
  #top,#nav,.noprint,#toast{display:none!important}
  body{background:#fff}
  main{padding:0;max-width:none}
  .paper{border:0;padding:0}
  #banner{display:block;border:1px solid #999}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<a class="skip" href="#app">Skip to main content</a>
<div id="banner" role="note">PROTOTYPE VERSION</div>
<header id="top">
  <div class="brand"><svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 3c-6 0-11 3.6-11 9.4 0 4 1.7 6.7 3 9.6 1.1 2.5 1.6 6 3.6 6 2.3 0 2.1-5.2 4.4-5.2s2.1 5.2 4.4 5.2c2 0 2.5-3.5 3.6-6 1.3-2.9 3-5.6 3-9.6C27 6.6 22 3 16 3z" fill="#0B7A75"/><circle cx="20.5" cy="11.5" r="3.2" fill="none" stroke="#fff" stroke-width="2"/><path d="M22.8 13.8l2.6 2.6" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg><div>OralGuard<small>Oral cancer screening and prevention</small></div></div>
  <div id="who"></div>
</header>
<div id="layout"><nav id="nav" aria-label="Main"></nav><main id="app" tabindex="-1"></main></div>
<div id="dlgroot"></div>
<div id="toast" role="status" aria-live="polite" hidden></div>
<input type="file" id="fileUp" accept="image/*" multiple hidden>
<input type="file" id="fileCap" accept="image/*" capture="environment" hidden>
<script>
'use strict';
/* =====================================================================
   OralGuard prototype. One file, no build step, no external libraries.
   ---------------------------------------------------------------------
   MODEL CONNECTION
   The app calls MODEL.predict(caseData). With backend "demo" it uses
   demoPredict() (simulated). With backend "api" it POSTs each photo and
   the metadata to your inference server (see the README / server.py)
   and expects the JSON contract described above apiPredict().
   ===================================================================== */

var APP_VERSION = '1.0.0';
var CLASSES = ['Healthy','Benign','OPMD','OCA'];
var CLASS_COL = ['#1E7F4F','#4C8DA8','#A35C00','#B42318'];

/* ---------- small utilities ---------- */
function $(id){ return document.getElementById(id); }
function esc(x){ return String(x==null?'':x).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function pct(x,d){ return (x*100).toFixed(d||0); }
function clamp(x,a,b){ return Math.max(a,Math.min(b,x)); }
function uid(p){ return (p||'id')+'-'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function today(){ return new Date(); }
function addDays(d,n){ var x=new Date(d); x.setDate(x.getDate()+n); return x; }
function fmtD(d){ if(!d) return '-'; var x=new Date(d); return x.toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'}); }
function fmtDT(d){ var x=new Date(d); return x.toLocaleDateString(undefined,{day:'numeric',month:'short'})+' '+x.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'}); }
function daysBetween(a,b){ return Math.round((new Date(b)-new Date(a))/86400000); }
function rng(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; var t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function gauss(R){ var u=0,v=0; while(!u) u=R(); while(!v) v=R(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); }
function sigmoid(z){ return 1/(1+Math.exp(-z)); }
function logit(p){ p=clamp(p,1e-4,1-1e-4); return Math.log(p/(1-p)); }
function toast(t){ var e=$('toast'); e.textContent=t; e.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(function(){ e.hidden=true; },2600); }
function opts(arr,v){ return arr.map(function(o){ var val=Array.isArray(o)?o[0]:o, lab=Array.isArray(o)?o[1]:o; return '<option value="'+esc(val)+'"'+(String(val)===String(v)?' selected':'')+'>'+esc(lab)+'</option>'; }).join(''); }

/* ---------- persistence (localStorage when available, memory otherwise) ---------- */
var STORE_KEY='oralguard.v1';
var canStore=(function(){ try{ localStorage.setItem('__og','1'); localStorage.removeItem('__og'); return true; }catch(e){ return false; } })();
var DB=null;
function freshDB(){
  return {cases:seedCases(), audit:[], outreach:{}, people:null, seq:1043,
    settings:{threshold:0.50, reviewBand:0.15, supp:10, backend:'demo', apiUrl:'', apiKey:'', siteChecked:false, calib:null, ramadan:false, quietStart:'21:00', quietEnd:'08:00', contactCap:2, siteName:'Demo Primary Care Centre'}};
}
function loadDB(){
  if(canStore){ try{ var raw=localStorage.getItem(STORE_KEY); if(raw){ DB=JSON.parse(raw); if(!DB.settings||!DB.cases) DB=null; } }catch(e){ DB=null; } }
  if(!DB) DB=freshDB();
}
function saveDB(){
  if(!canStore) return;
  try{ localStorage.setItem(STORE_KEY,JSON.stringify(DB)); }
  catch(e){ // most likely quota: drop full-size images from older cases, keep thumbnails
    DB.cases.forEach(function(c,i){ if(i>3 && c.imgs) c.imgs.forEach(function(g){ if(g.src && g.thumb){ g.src=g.thumb; g.trimmed=true; } }); });
    try{ localStorage.setItem(STORE_KEY,JSON.stringify(DB)); }catch(e2){}
  }
}
function audit(action,data,purpose){
  DB.audit.unshift({t:new Date().toISOString(), role:S.role||'-', action:action, data:data||'', purpose:purpose||''});
  if(DB.audit.length>300) DB.audit.length=300;
}

var MODEL = {
  info:function(){ return DB.settings.backend==='api' && DB.settings.apiUrl ? {name:'Connected model', version:(MODEL._remoteVersion||'remote'), simulated:false} : {name:'Demo simulator', version:'demo-1.0', simulated:true}; },
  predict:async function(d){
    if(DB.settings.backend==='api' && DB.settings.apiUrl){
      try{ return await apiPredict(d); }
      catch(e){ var r=demoPredict(d); r.fallback='Model endpoint failed ('+(e.message||e)+'). Showing simulated output instead.'; return r; }
    }
    return demoPredict(d);
  }
};

/* Image signal used by the simulator. It is NOT image analysis: it is set
   from the clinician's lesion annotation, or from the presenter slider. */
var LESION_TYPES = [
  ['white','White patch','#E8E1C8',0.52],
  ['red','Red patch','#E0535F',0.72],
  ['mixed','Red-and-white (speckled)','#E88AA0',0.82],
  ['ulcer','Ulcer or erosion','#F2A23A',0.78],
  ['mass','Growth or mass','#C2415B',0.90],
  ['fibro','Blanching or stiff bands','#B9A3E3',0.62],
  ['other','Other / unsure','#7FC4E0',0.45]
];
function lt(k){ for(var i=0;i<LESION_TYPES.length;i++) if(LESION_TYPES[i][0]===k) return LESION_TYPES[i]; return LESION_TYPES[6]; }

function imgSignal(g,d){
  if(d.simMode==='manual') return {v:d.sim/100, src:'presenter slider ('+d.sim+'/100)'};
  if(g.noLesion) return {v:0.10, src:'clinician marked no visible lesion'};
  if(g.ann && g.ann.length){
    var m=0,lab=''; g.ann.forEach(function(a){ var w=lt(a.type)[3]; if(w>m){ m=w; lab=lt(a.type)[1]; } });
    return {v:m, src:'clinician annotation: '+lab.toLowerCase()};
  }
  return {v:0.30, src:'no annotation (neutral default)'};
}

function demoPredict(d){
  var age=+d.age||0, per=[], R=rng(String(d.id||'x').split('').reduce(function(a,c){ return a+c.charCodeAt(0); },7));
  var meta=[];
  if(d.chew==='Yes') meta.push(['Chewing habit (betel quid, areca nut, gutka, naswar or other smokeless tobacco)',0.14]);
  if(d.smoke==='Yes') meta.push(['Smoking (cigarettes, bidi, shisha or dokha/midwakh)',0.05]);
  if(d.alcohol==='Yes') meta.push(['Alcohol use',0.03]);
  if(age>=45) meta.push(['Age 45 or older',0.05]);
  var metaSum=meta.reduce(function(a,b){ return a+b[1]; },0);
  var imgs=d.imgs.length?d.imgs:[{_none:true}];
  imgs.forEach(function(g,i){
    var sig=g._none?{v:d.simMode==='manual'?d.sim/100:0.30,src:'no photo'}:imgSignal(g,d);
    var imgC=0.08+0.62*sig.v;
    var s=clamp(imgC+metaSum+ (R()-0.5)*0.03, 0.02, 0.97);
    var sNoMeta=clamp(imgC+0.06,0.02,0.97); // uniform-metadata counterfactual (paper Sec. IV-E)
    var sd=0.015+0.05*(1-Math.abs(2*s-1));
    // split into four classes
    var dom=null; if(g.ann&&g.ann.length){ dom=g.ann.reduce(function(a,b){ return lt(b.type)[3]>lt(a.type)[3]?b:a; }).type; }
    var ocaShare=dom==='mass'?0.55:dom==='ulcer'?0.40:dom==='mixed'?0.30:0.14;
    var oca=s*ocaShare*(0.6+0.4*s), opmd=s-oca;
    var benShare=(dom&&!g.noLesion)?0.62:0.22, ben=(1-s)*benShare, hea=(1-s)-ben;
    per.push({i:i, probs:[hea,ben,opmd,oca], susp:s, susp_sd:sd, susp_nometa:sNoMeta, imgSrc:sig.src, imgC:imgC, gradcam:null});
  });
  var top=per.reduce(function(a,b){ return b.susp>a.susp?b:a; });
  var contrib=[['Image signal (photo '+(top.i+1)+', '+top.imgSrc+')',top.imgC]].concat(meta);
  return {simulated:true, model:'demo-1.0', perImage:per, top:top.i, probs:top.probs, susp:top.susp, susp_sd:top.susp_sd, susp_nometa:top.susp_nometa, contrib:contrib, base:0.08};
}

/* ---- Real model over HTTP --------------------------------------------
   POST {apiUrl}/predict   multipart/form-data
     image    : JPEG file (one call per photo)
     metadata : JSON {age, sex, smoking, alcohol, chewing}  (0/1, age in years)
     roi      : JSON list of clinician shapes in 0..1 image coordinates (optional)
   200 JSON:
     { "model_version":"oralguard-effb4-epiprior-1.0",
       "probs":{"Healthy":0.1,"Benign":0.2,"OPMD":0.5,"OCA":0.2},
       "probs_sd":{"Healthy":0.02,...}            (optional, fold spread)
       "suspicion":0.71, "suspicion_sd":0.04,
       "suspicion_uniform_meta":0.52,            (optional, Sec. IV-E test)
       "gradcam_png":"<base64 PNG, same aspect as input>" (optional) }
   ---------------------------------------------------------------------- */
async function apiPredict(d){
  var url=DB.settings.apiUrl.replace(/\/+$/,'')+'/predict', per=[];
  var meta={age:+d.age||0, sex:d.sex||'', smoking:d.smoke==='Yes'?1:0, alcohol:d.alcohol==='Yes'?1:0, chewing:d.chew==='Yes'?1:0};
  if(!d.imgs.length) throw new Error('no photo');
  for(var i=0;i<d.imgs.length;i++){
    var g=d.imgs[i], blob=await (await fetch(g.src)).blob(), fd=new FormData();
    fd.append('image',blob,'photo'+(i+1)+'.jpg'); fd.append('metadata',JSON.stringify(meta)); fd.append('roi',JSON.stringify(g.ann||[])); fd.append('history',JSON.stringify({tobacco_types:d.tob||[], chewing_types:d.chewT||[], family_history:d.famhx, previous_opmd:d.prior, inherited_risk:d.genetic, last_exam:d.lastExam, photo_site:g.site||'', red_flags:d.flags||[]}));
    var headers={}; if(DB.settings.apiKey) headers['Authorization']='Bearer '+DB.settings.apiKey;
    var ctl=new AbortController(), to=setTimeout(function(){ ctl.abort(); },60000);
    var res=await fetch(url,{method:'POST',body:fd,headers:headers,signal:ctl.signal}); clearTimeout(to);
    if(!res.ok) throw new Error('HTTP '+res.status);
    var j=await res.json(); MODEL._remoteVersion=j.model_version;
    var p=CLASSES.map(function(c){ return +(j.probs&&j.probs[c])||0; });
    var s=j.suspicion!=null?+j.suspicion:p[2]+p[3];
    per.push({i:i, probs:p, probs_sd:j.probs_sd?CLASSES.map(function(c){ return +j.probs_sd[c]||0; }):null, susp:s, susp_sd:+j.suspicion_sd||0, susp_nometa:j.suspicion_uniform_meta!=null?+j.suspicion_uniform_meta:null, imgSrc:'connected model', gradcam:j.gradcam_png?'data:image/png;base64,'+j.gradcam_png:null, lesion:j.lesion_type||null, lesionConf:j.lesion_confidence, differential:j.differential||[], findings:j.findings||'', warning:j.warning||null, regions:Array.isArray(j.regions)?j.regions:null});
  }
  var top=per.reduce(function(a,b){ return b.susp>a.susp?b:a; });
  var contrib=null;
  if(top.susp_nometa!=null) contrib=[['Image (with uninformative metadata)',top.susp_nometa],['Patient metadata (age, sex, habits)',top.susp-top.susp_nometa]];
  return {simulated:false, model:MODEL._remoteVersion||'remote', perImage:per, top:top.i, probs:top.probs, susp:top.susp, susp_sd:top.susp_sd, susp_nometa:top.susp_nometa, contrib:contrib, base:0};
}

/* ---- Tier and pathway rules (placeholders until programme guidelines are loaded) ---- */
function tierOf(r,d){
  var thr=effThreshold(), flags=d.flags.length;
  if(flags>=1 && (flags>=2 || r.probs[3]>=0.30)) return 'Urgent';
  if(r.susp>=thr || flags) return 'Refer';
  if(r.susp>=thr-DB.settings.reviewBand) return 'Review';
  return 'Routine';
}
function effThreshold(){ return DB.settings.threshold; }
var TIERS = {
  Urgent:{c:'#8E1B12',bg:'var(--redbg)',ic:'‼',t:'Urgent referral suggested',s:'Red flags with a high screening signal. Suggests specialist assessment within 2 weeks.'},
  Refer:{c:'#B42318',bg:'var(--redbg)',ic:'➜',t:'Referral suggested',s:'Screening signal at or above the site threshold, or a red flag is present.'},
  Review:{c:'#A35C00',bg:'var(--amberbg)',ic:'◐',t:'Specialist tele-review suggested',s:'Signal close to the threshold. A specialist reviews the photos remotely before any referral.'},
  Routine:{c:'#1E7F4F',bg:'var(--greenbg)',ic:'✓',t:'No raised screening signal',s:'Routine recall and prevention advice.'}
};
function pathwayFor(tier,d){
  var p=[], now=today(), habits=(d.chew==='Yes'||d.smoke==='Yes'||d.alcohol==='Yes');
  if(tier==='Urgent') p.push({t:'Urgent referral to oral medicine or oral and maxillofacial surgery',w:'Appointment within 14 days',due:addDays(now,14),k:'referral'});
  if(tier==='Refer') p.push({t:'Referral to oral medicine or oral and maxillofacial surgery',w:'Appointment within 4 weeks',due:addDays(now,28),k:'referral'});
  if(tier==='Review') p.push({t:'Remote specialist review of the photos and annotation',w:'Within 7 days',due:addDays(now,7),k:'review'},{t:'Re-examine the lesion after removing local irritants',w:'In 2 to 3 weeks; refer if it persists',due:addDays(now,21),k:'recheck'});
  if(tier==='Routine') p.push({t:'Routine recall within the adult comprehensive screening programme',w:habits?'Re-screen in 12 months (higher-risk habits)':'Re-screen at the next comprehensive screening',due:addDays(now,habits?365:730),k:'recall'});
  if(d.chew==='Yes'||d.smoke==='Yes') p.push({t:'Offer tobacco, betel-quid and dokha cessation support',w:'Today, brief advice plus referral to the cessation service if accepted',due:now,k:'cessation'});
  if(d.alcohol==='Yes') p.push({t:'Brief alcohol advice',w:'Today',due:now,k:'advice'});
  p.push({t:'Give the prevention card with monthly mouth self-check',w:'Today, in '+langShort(d.lang),due:now,k:'card'});
  if(tier!=='Routine') p.push({t:'Track the referral until the outcome is recorded',w:'Navigator follow-up if not attended by the due date',due:p[0].due,k:'track'});
  return p;
}

function mkPeople(){
  var R=rng(20271), pk=function(a){ return a[Math.floor(R()*a.length)]; }, out=[];
  var langBy={'Abu Dhabi Island':['ar','en','hi','ur','ar'],'Mussafah':['bn','ur','hi','bn','ur','hi'],'Khalifa City':['ar','en','ar'],'Al Ain':['ar','ar','ur','en'],'Al Dhafra':['ur','ar','bn']};
  for(var i=0;i<90;i++){
    var comm=i<4?'Al Dhafra':pk(['Abu Dhabi Island','Mussafah','Mussafah','Khalifa City','Al Ain']);
    var kid=R()<0.14, age=kid?3+Math.floor(R()*12):18+Math.floor(R()*62), lang=pk(langBy[comm]);
    var sa=(lang==='bn'||lang==='ur'||lang==='hi');
    var hab=function(y){ var x=R(); return x<0.08?'Unknown':(x<0.08+y?'Yes':'No'); };
    var p={id:'C-'+(3001+i),kid:kid,age:age,band:kid?'Child (3-14)':age<30?'18-29':age<45?'30-44':age<60?'45-59':'60+',sex:kid?pk(['F','M']):(sa?(R()<0.8?'M':'F'):pk(['F','M'])),comm:comm,lang:lang,
      ch:pk(['SMS','WhatsApp','Phone call','In person (community health worker)']),
      smoke:kid?'No':hab(lang==='ar'?0.3:0.22),alcohol:kid?'No':hab(0.08),chew:kid?'No':hab(sa?0.42:0.05),famhx:R()<0.06?'Yes':'No',
      mo:R()<0.28?null:1+Math.floor(R()*40),recall:pk(['None','None','Booked','Missed']),ref:R()<0.12?pk(['Completed','Not completed','Not completed']):'None',
      wcv:kid?(R()<0.45?'Overdue':'Up to date'):null};
    var q=[];
    if(p.chew==='Yes') q.push(['Chewing habit (betel quid, areca nut or smokeless tobacco)',3,'risk']);
    if(p.smoke==='Yes') q.push(['Smoking, shisha or dokha',1,'risk']);
    if(p.alcohol==='Yes') q.push(['Alcohol use',1,'risk']);
    if(p.famhx==='Yes') q.push(['Family history of head and neck cancer',1,'risk']);
    if(!kid&&age>=45) q.push(['Age 45 or older',1,'risk']);
    p.fl=[];
    if(kid){ if(p.wcv==='Overdue'){ q.push(['Well-Child Visit oral-health check overdue',2,'gap']); p.fl.push('WCV overdue'); } }
    else if(p.mo===null){ q.push(['Never had an oral examination on record',2,'gap']); p.fl.push('Never screened'); }
    else if(p.mo>(p.chew==='Yes'||p.smoke==='Yes'?12:24)){ q.push(['Oral examination overdue ('+p.mo+' months ago)',1,'gap']); p.fl.push('Overdue'); }
    if(p.recall==='Missed'){ q.push(['Missed recall appointment',1,'gap']); p.fl.push('Missed recall'); }
    if(p.ref==='Not completed'){ q.push(['Earlier referral not completed',3,'gap']); p.fl.push('Referral not completed'); }
    ['smoke','chew'].forEach(function(k){ if(p[k]==='Unknown') q.push([(k==='smoke'?'Smoking':'Chewing habit')+' status unknown (no points; ask at contact)',0,'missing']); });
    p.q=q; p.pr=q.reduce(function(a,b){ return a+b[1]; },0);
    out.push(p);
  }
  return out;
}

var POP=null;
function mkPop(){
  var R=rng(777), out=[];
  var sizes={'Abu Dhabi Island':420,'Mussafah':520,'Khalifa City':260,'Al Ain':300,'Al Dhafra':38};
  var langBy={'Abu Dhabi Island':['ar','en','hi','ur','ar'],'Mussafah':['bn','ur','hi','bn','ur','hi'],'Khalifa City':['ar','en','ar'],'Al Ain':['ar','ar','ur','en'],'Al Dhafra':['ur','ar','bn']};
  Object.keys(sizes).forEach(function(c){
    for(var i=0;i<sizes[c];i++){
      var lang=langBy[c][Math.floor(R()*langBy[c].length)], sa=/bn|ur|hi/.test(lang);
      var x=R(), band=x<0.27?'18-29':x<0.58?'30-44':x<0.86?'45-59':'60+';
      var sex=sa?(R()<0.78?'M':'F'):(R()<0.5?'M':'F');
      var chew=sa?R()<0.40:R()<0.05, smoke=R()<0.22;
      var risk=0.02+(chew?0.07:0)+(smoke?0.02:0)+(band==='45-59'||band==='60+'?0.03:0);
      var truth=R()<risk; // suspicious lesion actually present (OPMD/OCA)
      var inv=R()<(c==='Al Dhafra'?0.55:0.78);
      var booked=inv&&R()<(lang==='en'||lang==='ar'?0.66:0.58);
      var att=booked&&R()<(c==='Mussafah'?0.74:0.84);
      var z=truth?1.25+gauss(R)*1.0:gauss(R)*1.0; // AUC about 0.81
      var score=sigmoid(-1.1+1.35*z+(chew?0.5:0));
      var flagged=att&&score>=0.5, review=att&&!flagged&&score>=0.35;
      var refAtt=flagged&&R()<(sa?0.70:0.82), days=refAtt?Math.round(6+R()*34+(sa?6:0)):null;
      var outcome=refAtt?truth:null; // confirmed among referrals that attended
      var fnSeen=att&&!flagged&&truth&&R()<0.45; // missed cases later surfaced (lower bound)
      var recallDue=att&&!flagged, recallDone=recallDue&&R()<0.6;
      out.push({comm:c,lang:lang,band:band,sex:sex,chew:chew,inv:inv,booked:booked,att:att,truth:truth,score:score,flagged:flagged,review:review,refAtt:refAtt,days:days,outcome:outcome,fnSeen:fnSeen,recallDue:recallDue,recallDone:recallDone,cess:att&&(chew||smoke)&&R()<0.34});
    }
  });
  return out;
}

function quality(c,ow,oh){

function resultViewerInit(d,r){
  var cv=$('rescv'); if(!cv||!d.imgs.length) return;
  var i=S.res.pv, g=d.imgs[i], pr=r.perImage[i]||r.perImage[0], img=new Image();

    if(pr.gradcam){ var gi=new Image(); gi.onload=function(){ draw(gi); }; gi.src=pr.gradcam; }

function regionHeat(regions,s,W,H){
  var gw=64, gh=Math.max(8,Math.round(64*H/W)), c=document.createElement('canvas'); c.width=gw; c.height=gh;
  var x=c.getContext('2d'), im=x.createImageData(gw,gh), vals=new Float32Array(gw*gh), mx=0;
  var bx=regions.map(function(r){ var b=(r&&r.box_2d)||[]; return b.length===4?[b[1]/1000,b[0]/1000,b[3]/1000,b[2]/1000]:null; }).filter(Boolean);
  for(var y=0;y<gh;y++) for(var xx=0;xx<gw;xx++){ var u=xx/gw, v=y/gh, val=0; bx.forEach(function(b){ var cx=(b[0]+b[2])/2, cy=(b[1]+b[3])/2, sx=Math.max(0.04,(b[2]-b[0])/2.2), sy=Math.max(0.04,(b[3]-b[1])/2.2); val+=Math.exp(-(Math.pow((u-cx)/sx,2)+Math.pow((v-cy)/sy,2))/2); }); vals[y*gw+xx]=val; if(val>mx) mx=val; }
  if(!mx) return null;
  for(var k=0;k<vals.length;k++){ var t=vals[k]/mx*(0.35+0.65*s), rgb=jet(t); im.data[k*4]=rgb[0]; im.data[k*4+1]=rgb[1]; im.data[k*4+2]=rgb[2]; im.data[k*4+3]=Math.round(255*clamp(t*1.3,0,1)); }
  x.putImageData(im,0,0); return c;
}
function simHeat(g,s,W,H){
  var gw=64, gh=Math.max(8,Math.round(64*H/W)), c=document.createElement('canvas'); c.width=gw; c.height=gh;
  var x=c.getContext('2d'), im=x.createImageData(gw,gh), R=rng(Math.round(s*1000)+g.ann.length);
  var cs=g.ann.length?g.ann.map(function(a){ var b=shapeBox(a); return [(b[0]+b[2])/2+(R()-0.5)*0.05,(b[1]+b[3])/2+(R()-0.5)*0.05,Math.max(0.06,Math.sqrt(shapeArea(a))*0.7),lt(a.type)[3]]; }):[[0.5+(R()-0.5)*0.2,0.55+(R()-0.5)*0.2,0.22,Math.max(0.15,s)]];
  var vals=new Float32Array(gw*gh), mx=0;
  for(var y=0;y<gh;y++) for(var xx=0;xx<gw;xx++){ var u=xx/gw, v=y/gh, val=0; cs.forEach(function(q){ var dx=(u-q[0]), dy=(v-q[1])*H/W; val+=q[3]*Math.exp(-(dx*dx+dy*dy)/(2*q[2]*q[2])); }); val+=0.04*R(); vals[y*gw+xx]=val; if(val>mx) mx=val; }
  for(var k=0;k<vals.length;k++){ var t=vals[k]/mx*(0.35+0.65*s), rgb=jet(t); im.data[k*4]=rgb[0]; im.data[k*4+1]=rgb[1]; im.data[k*4+2]=rgb[2]; im.data[k*4+3]=Math.round(255*clamp(t*1.3,0,1)); }
  x.putImageData(im,0,0); return c;
}
function jet(v){ var f=function(a){ return Math.round(255*clamp(1.5-Math.abs(4*v-a),0,1)); }; return [f(3),f(2),f(1)]; }

function roc(pairs){
  var s=pairs.slice().sort(function(a,b){ return b[0]-a[0]; }), P=s.filter(function(q){ return q[1]; }).length, N=s.length-P, tp=0, fp=0, pts=[[0,0,1]], auc=0, pf=0, pt=0;
  s.forEach(function(q){ if(q[1]) tp++; else fp++; pts.push([fp/N,tp/P,q[0]]); auc+=(fp/N-pf)*(tp/P+pt)/2; pf=fp/N; pt=tp/P; });
  return {pts:pts,auc:auc,P:P,N:N};
}
function opAt(pairs,thr){ var tp=0,fp=0,fn=0,tn=0; pairs.forEach(function(q){ var pos=q[0]>=thr; if(q[1]){ if(pos) tp++; else fn++; } else { if(pos) fp++; else tn++; } }); return {se:tp/(tp+fn),sp:tn/(tn+fp),ppv:tp/Math.max(1,tp+fp),npv:tn/Math.max(1,tn+fn),ref:(tp+fp)/pairs.length}; }
function platt(pairs){ var a=0,b=1,lr=0.05; for(var it=0;it<400;it++){ var ga=0,gb=0; pairs.forEach(function(q){ var x=logit(q[0]), p=sigmoid(a+b*x), e=p-q[1]; ga+=e; gb+=e*x; }); a-=lr*ga/pairs.length; b-=lr*gb/pairs.length; } return {a:a,b:b}; }
function trust(){
  var T=S.tc=S.tc||{k:'sm',target:85,name:'SMART-OM (India)',se:56.1,sp:70.3,pv:5.9};
  var pairs=localSample(T.k), R0=roc(pairs), cur=opAt(pairs,effThreshold());
  var cand=R0.pts.filter(function(p){ return p[1]>=T.target/100; })[0]||R0.pts[R0.pts.length-1], sugg=clamp(cand[2],0.05,0.95), so=opAt(pairs,sugg);
  var pl=platt(pairs), recal=pairs.map(function(q){ return [sigmoid(pl.a+pl.b*logit(q[0])),q[1]]; }), c1=calib(pairs), c2=calib(recal);
  var h='<h1>Site trust check</h1>'+
    '<div class="'+(DB.settings.siteChecked?'ok':'note')+'"><b>'+(DB.settings.siteChecked?'✓ Site check applied':'⚠ Site check not yet applied')+'.</b> Threshold in use: <b>'+effThreshold().toFixed(2)+'</b>'+(DB.settings.calib?' (set '+fmtD(DB.settings.calib.at)+' on '+esc(DB.settings.calib.sample)+', target sensitivity '+DB.settings.calib.target+'%)':' (development-cohort default)')+'.</div>'+
    '<p class="help">The validated model kept its discrimination in a Bangladeshi cohort that resembled its training data, but its fixed threshold did not transfer to a low-prevalence Indian cohort, where only about one referral in ten was a true positive. Before go-live, each site scores a local sample with specialist outcomes, checks discrimination, picks its own threshold and recalibrates.</p>'+
    '<div class="card"><h2>1. Score a local verification sample</h2><div class="seg">'+Object.keys(LOCAL).map(function(k){ return '<button class="'+(T.k===k?'on':'')+'" onclick="S.tc.k=\''+k+'\';render()">'+LOCAL[k].n+'</button>'; }).join('')+'</div>'+
    '<p class="help" style="margin-top:8px">'+pairs.length+' simulated people, '+R0.P+' with a confirmed suspicious lesion (prevalence '+pct(R0.P/pairs.length,1)+'%).</p>'+
    '<div class="grid2"><div>'+rocSvg(R0,effThreshold(),sugg,pairs)+'</div><div>'+
      '<div class="kpi" style="margin-bottom:10px"><b>AUC '+R0.auc.toFixed(3)+'</b><span>Discrimination on the local sample</span></div>'+
      '<table class="t"><thead><tr><th></th><th class="num">Current '+effThreshold().toFixed(2)+'</th><th class="num">Suggested '+sugg.toFixed(2)+'</th></tr></thead><tbody>'+
      [['Sensitivity','se'],['Specificity','sp'],['PPV (referrals that are true)','ppv'],['NPV','npv'],['Referred per 1,000','ref']].map(function(r){ var f=function(o){ return r[1]==='ref'?Math.round(o.ref*1000):pct(o[r[1]],1)+'%'; }; return '<tr><td>'+r[0]+'</td><td class="num">'+f(cur)+'</td><td class="num"><b>'+f(so)+'</b></td></tr>'; }).join('')+'</tbody></table></div></div></div>'+
    '<div class="card"><h2>2. Choose the operating point</h2><label class="f" for="tgt">Target sensitivity: <b id="tgv">'+T.target+'%</b></label><input type="range" id="tgt" min="60" max="97" value="'+T.target+'" onchange="S.tc.target=+this.value;render()" oninput="$(\'tgv\').textContent=this.value+\'%\'">'+
    '<p class="help">Higher sensitivity misses fewer lesions but refers more people. The programme sets the target with clinicians; capacity of the specialist clinic is part of that choice.</p></div>'+
    '<div class="card"><h2>3. Recalibrate</h2><div class="grid2"><div>'+calSvg(c1,c2)+'</div><div><p>Expected calibration error <b>'+pct(c1.ece,1)+'</b> before and <b>'+pct(c2.ece,1)+'</b> points after Platt scaling on the local sample (a = '+pl.a.toFixed(2)+', b = '+pl.b.toFixed(2)+').</p><p class="help">Recalibration makes the displayed percentage mean what it says locally. It does not change which patients rank higher, so AUC is unchanged.</p></div></div></div>'+
    '<div class="card"><h2>4. Apply</h2>'+(can('admin')?'<button class="btn p" onclick="applySite('+sugg.toFixed(3)+')">Apply threshold '+sugg.toFixed(2)+' to this site</button> <button class="btn q" onclick="DB.settings.threshold=0.5;DB.settings.siteChecked=false;DB.settings.calib=null;audit(\'Threshold reset\',\'0.50\',\'Site governance\');saveDB();render()">Reset to 0.50</button><p class="tiny">Needs clinical sign-off. The change is written to the data-use log and shown on every result.</p>':needRole('admin'))+'</div>'+
    '<div class="card"><h2>What the published validation says (manuscript values)</h2><p class="help">PPV at threshold 0.50 for each validation cohort. Move the sliders to try another population.</p><div class="row">'+Object.keys(COH).map(function(n){ return '<button class="btn sm '+(T.name===n?'p':'')+'" onclick="S.tc.name=\''+n+'\';S.tc.se='+COH[n][0]+';S.tc.sp='+COH[n][1]+';S.tc.pv='+COH[n][2]+';render()">'+n+'</button>'; }).join('')+'</div>'+
    ['pv:Prevalence:100','se:Sensitivity:100','sp:Specificity:100'].map(function(s){ var a=s.split(':'); return '<label class="f" for="pc'+a[0]+'">'+a[1]+': <b id="pv_'+a[0]+'">'+T[a[0]]+'</b>%</label><input type="range" id="pc'+a[0]+'" min="0.5" max="99.5" step="0.1" value="'+T[a[0]]+'" oninput="S.tc.'+a[0]+'=+this.value;S.tc.name=\'Custom\';$(\'pv_'+a[0]+'\').textContent=this.value;$(\'ppvout\').innerHTML=ppvHtml()">'; }).join('')+
    '<div id="ppvout">'+ppvHtml()+'</div></div>'+
    '<div class="card"><h2>How much does the model lean on habit data?</h2><p class="help">Screening AUC with real metadata against an uninformative metadata vector at inference (manuscript Table VI).</p>'+
    META.map(function(m){ return '<b>'+m[0]+'</b><div class="bar-h"><span>Real metadata</span><div class="tr"><i style="width:'+(m[1]*100)+'%"></i></div><b>'+m[1].toFixed(3)+'</b></div><div class="bar-h"><span>Uninformative</span><div class="tr"><i class="g" style="width:'+(m[2]*100)+'%"></i></div><b>'+m[2].toFixed(3)+'</b></div>'; }).join('')+
    '<p class="help">Habit data helped where the population resembled the training cohort and added nothing in the low-prevalence cohort. Run this test on the local sample before trusting the metadata branch.</p></div>';
  $('app').innerHTML=h;
}
function ppvHtml(){ var t=S.tc, se=t.se/100, sp=t.sp/100, pv=t.pv/100, tp=1000*se*pv, fp=1000*(1-sp)*(1-pv), ref=tp+fp;
  return '<div class="grid" style="margin-top:10px">'+kpi(pct(tp/ref,1)+'%','PPV: referrals that are true positives')+kpi(Math.round(ref),'Referrals per 1,000 screened')+kpi(Math.round(fp),'False positives per 1,000')+kpi(tp>0?'1 in '+Math.round(ref/tp):'-','True positives among referrals')+'</div>'; }
function rocSvg(R0,thr,sugg,pairs){
  var W=260, m=30, X=function(v){ return m+v*(W-m-8); }, Y=function(v){ return W-m-v*(W-m-8); };
  var step=Math.max(1,Math.floor(R0.pts.length/200)), pts=R0.pts.filter(function(p,i){ return i%step===0; }).concat([R0.pts[R0.pts.length-1]]);
  var dot=function(t,col,l){ var o=opAt(pairs,t); return '<circle cx="'+X(1-o.sp).toFixed(1)+'" cy="'+Y(o.se).toFixed(1)+'" r="5" fill="'+col+'" stroke="#fff" stroke-width="1.5"><title>'+l+'</title></circle>'; };
  return '<svg class="svgc" viewBox="0 0 '+W+' '+W+'" width="100%" style="max-width:320px" role="img" aria-label="ROC curve, AUC '+R0.auc.toFixed(3)+'"><rect x="'+m+'" y="8" width="'+(W-m-8)+'" height="'+(W-m-8)+'" fill="#F8FAFA" stroke="#D5DEDF"/><line x1="'+X(0)+'" y1="'+Y(0)+'" x2="'+X(1)+'" y2="'+Y(1)+'" stroke="#9AA8AB" stroke-dasharray="4 3"/>'+
    '<polyline fill="none" stroke="#0B7A75" stroke-width="2.2" points="'+pts.map(function(p){ return X(p[0]).toFixed(1)+','+Y(p[1]).toFixed(1); }).join(' ')+'"/>'+dot(thr,'#B42318','Current threshold')+dot(sugg,'#0B7A75','Suggested threshold')+
    '<text x="'+(W/2+10)+'" y="'+(W-4)+'" font-size="10" text-anchor="middle" fill="#56676B">1 − specificity</text><text x="10" y="'+(W/2-10)+'" font-size="10" text-anchor="middle" fill="#56676B" transform="rotate(-90 10 '+(W/2-10)+')">Sensitivity</text></svg>'+
    '<div class="legend"><span><i style="background:#B42318"></i>Current threshold</span><span><i style="background:#0B7A75"></i>Suggested</span></div>';
}
function applySite(t){ DB.settings.threshold=+t; DB.settings.siteChecked=true; DB.settings.calib={at:new Date().toISOString(),sample:LOCAL[S.tc.k].n,target:S.tc.target};
  audit('Site threshold applied',t.toFixed?t.toFixed(2):String(t)+' on '+LOCAL[S.tc.k].n,'Site governance; clinical sign-off'); saveDB(); toast('Threshold '+(+t).toFixed(2)+' applied'); render(); }

function governance(){
  var tab=S.sub.gov||'card';
  var tabs=[['card','Model card'],['conn','Model connection'],['log','Data-use log'],['safe','Privacy and safety'],['pilot','Pilot and roadmap']];
  var h='<h1>Governance</h1><div class="tabs" role="tablist">'+tabs.map(function(t){ return '<button role="tab" aria-selected="'+(tab===t[0])+'" class="'+(tab===t[0]?'on':'')+'" onclick="S.sub.gov=\''+t[0]+'\';render()">'+t[1]+'</button>'; }).join('')+'</div>';
  h+={card:govCard,conn:govConn,log:govLog,safe:govSafe,pilot:govPilot}[tab]();
  $('app').innerHTML=h;
}
function gc(t,b){ return '<div class="card"><h2>'+t+'</h2>'+b+'</div>'; }
function ul(a){ return '<ul style="padding-left:1.1em;margin:0">'+a.map(function(x){ return '<li style="margin:4px 0">'+x+'</li>'; }).join('')+'</ul>'; }
function govCard(){
  var i=MODEL.info();
  return '<div class="'+(i.simulated?'note':'ok')+'">Running: <b>'+esc(i.name)+'</b> ('+esc(i.version)+'). The figures below are from the manuscript, not from this prototype.</div>'+
    '<div class="grid2">'+gc('Intended use',ul(['Screening aid for clinicians, registered nurses and authorized screeners','Adults 18 and over; white-light smartphone or intraoral-camera photos','Output: four-class estimate (Healthy, Benign, OPMD, oral cancer) and a suspicion signal for refer or not','Not for diagnosis, not for self-use by the public, not for children']))+
    gc('Model',ul(['EfficientNet-B4 image encoder, 5-fold ensemble with 8-view test-time augmentation','Lesion-guided attention: masks supervise an attention decoder during training only','XGBoost metadata branch on age, sex, smoking, alcohol and chewing','EpiPrior: training-only constraint that exposed groups receive more suspicion than unexposed groups']))+'</div>'+
    gc('Validation (screening, threshold 0.50)','<div class="tw"><table class="t"><thead><tr><th>Cohort</th><th class="num">Images</th><th class="num">Suspicious</th><th class="num">AUC</th><th class="num">Sensitivity</th><th class="num">Specificity</th></tr></thead><tbody>'+
      '<tr><td>Sri Lanka internal test</td><td class="num">414</td><td class="num">55.4%</td><td class="num">0.916</td><td class="num">82.5%</td><td class="num">88.1%</td></tr>'+
      '<tr><td>BD-Oral, Bangladesh (external)</td><td class="num">209</td><td class="num">53.1%</td><td class="num">0.786</td><td class="num">78.1%</td><td class="num">71.5%</td></tr>'+
      '<tr><td>SMART-OM, India (external)</td><td class="num">2,541</td><td class="num">5.9%</td><td class="num">0.701</td><td class="num">56.1%</td><td class="num">70.3%</td></tr></tbody></table></div><p class="help">Internal four-class accuracy 72.4% (balanced 61.5%). Development: 2,745 images from 672 patients in Sri Lanka.</p>')+
    '<div class="grid2">'+gc('Known limitations',ul(['Small cancer class (129 training, 19 internal test, 20 SMART-OM images); cancer F1 44%','Threshold did not transfer to a low-prevalence population: local calibration is required','Metadata helped only where habits and case mix resembled training','Trained at a single hospital; no prospective evaluation yet','Not validated in children or in Gulf populations; habit variables defined differently across cohorts']))+
    gc('How the app handles them',ul(['Screening signal is primary; the cancer percentage is labelled indicative','Site trust check and recalibration before go-live; threshold shown on every result','Uniform-metadata comparison shown per patient when the model returns it','Clinician decides; red flags override; overrides are logged and fed back','Under 18: no score, Well-Child Visit pathway']))+'</div>';
}
function govConn(){
  var s=DB.settings;
  return '<div class="card"><h2>Model connection</h2><p class="help">The prototype ships with a simulator. Point it at a model service to replace the simulator; photos and the patient history are then sent to that service only. The service\'s model name is shown on every result.</p>'+
    (can('admin')?'<label class="f" for="be">Backend</label><select id="be">'+opts([['demo','Demo simulator (no data leave the browser)'],['api','Connected model service (HTTPS)']],s.backend)+'</select>'+
    '<label class="f" for="au">Endpoint base URL</label><input type="url" id="au" placeholder="https://your-space.hf.space" value="'+esc(s.apiUrl)+'">'+
    '<label class="f" for="ak">Access token (optional)</label><input type="text" id="ak" value="'+esc(s.apiKey)+'" autocomplete="off">'+
    '<div class="row" style="margin-top:12px"><button class="btn p" onclick="saveConn()">Save</button><button class="btn" onclick="testConn()">Test connection</button></div><div id="ctest"></div>':needRole('admin'))+'</div>'+
    gc('API contract','<pre style="white-space:pre-wrap;font-size:.85rem;background:#F8FAFA;padding:10px;border-radius:6px;overflow:auto">GET  /health   → {"status":"ok","model_version":"..."}\nPOST /predict  multipart/form-data\n  image    : JPEG\n  metadata : {"age":56,"sex":"Male","smoking":0,"alcohol":0,"chewing":1}\n  roi      : [ {type, shape, pts:[[x,y],...]} ]   (optional, 0..1 coords)\n→ {"model_version":"oralguard-1.0",\n   "probs":{"Healthy":..,"Benign":..,"OPMD":..,"OCA":..},\n   "probs_sd":{...}, "suspicion":0.71, "suspicion_sd":0.04,\n   "suspicion_uniform_meta":0.52,\n   "gradcam_png":"&lt;base64&gt;"}</pre><p class="help">A reference FastAPI server (server.py) that loads the five fold models and the XGBoost metadata models is provided with this prototype.</p>');
}
function saveConn(){ var s=DB.settings; s.backend=$('be').value; s.apiUrl=$('au').value.trim(); s.apiKey=$('ak').value.trim(); audit('Model connection changed',s.backend+(s.apiUrl?' '+s.apiUrl:''),'Model governance'); saveDB(); toast('Saved'); render(); }
async function testConn(){ var u=$('au').value.trim().replace(/\/+$/,''), o=$('ctest'); if(!u){ o.innerHTML='<div class="note">Enter a URL first.</div>'; return; } o.innerHTML='<p class="help">Testing…</p>';
  try{ var r=await fetch(u+'/health'); var j=await r.json(); o.innerHTML='<div class="ok">Connected: '+esc(j.model_version||j.status||'ok')+'</div>'; }catch(e){ o.innerHTML='<div class="warn">Could not reach '+esc(u)+'/health ('+esc(e.message)+'). Check the URL, that the server is running, and that it allows CORS from this site.</div>'; } }
function govLog(){
  return '<div class="card"><div class="row sp"><h2 style="margin:0">Data-use log</h2><button class="btn sm" onclick="exportLog()">Export CSV</button></div><p class="help">Every access to or use of personal data in this browser: who (role), what, and for what purpose. In production this log is server-side and tamper-evident.</p>'+
    '<div class="tw"><table class="t audit"><thead><tr><th>Time</th><th>Role</th><th>Action</th><th>Data</th><th>Purpose</th></tr></thead><tbody>'+(DB.audit.length?DB.audit.slice(0,120).map(function(a){ return '<tr><td style="white-space:nowrap">'+fmtDT(a.t)+'</td><td>'+esc(a.role)+'</td><td>'+esc(a.action)+'</td><td>'+esc(a.data)+'</td><td>'+esc(a.purpose)+'</td></tr>'; }).join(''):'<tr><td colspan="5" class="help">Nothing logged yet. Run a screening.</td></tr>')+'</tbody></table></div></div>';
}
function exportLog(){ var rows=[['time','role','action','data','purpose']].concat(DB.audit.map(function(a){ return [a.t,a.role,a.action,a.data,a.purpose]; })); download('oralguard_data_use_log.csv','data:text/csv;charset=utf-8,'+encodeURIComponent(rows.map(function(r){ return r.map(function(x){ return '"'+String(x).replace(/"/g,'""')+'"'; }).join(','); }).join('\n'))); }
function govSafe(){
  return '<div class="grid2">'+gc('Privacy by design',ul(['Pseudonymous case IDs; no names or Emirates ID in this tool','Granular consent: photos, data use, contact, and model improvement are separate choices','Data minimization: the model receives one photo and five fields','In this prototype everything stays in the browser; production stores data in-country on approved infrastructure','Role-based access; every use written to the data-use log']))+
    gc('Clinical safety',ul(['The clinician decides; overrides are expected and recorded with a reason','Red flags force referral whatever the score','Neutral wording: "screening signal", "referral suggested", never "cancer detected"','Uncertainty, threshold, calibration status and missing data shown on every result','Under 18: no score; Well-Child Visit route']))+'</div>'+
    gc('Regulatory alignment (to confirm with the Department of Health)',ul(['Abu Dhabi Department of Health policy on the use of AI in healthcare','Abu Dhabi Healthcare Information and Cyber Security Standard (ADHICS)','UAE Federal Law No. 2 of 2019 on ICT in health fields (health data kept in the UAE)','Software as a medical device: classification and registration before clinical use','Integration with the Abu Dhabi health information exchange (Malaffi) under a data-sharing agreement']))+
    gc('Equity',ul(['Population safeguards show reach, uptake, referral and error rates by area, language, age and sex','Small cells are suppressed','Patient materials in Arabic, English, Bangla, Urdu and Hindi, with native-speaker review before use','Habit questions cover Gulf (dokha, midwakh, shisha) and South Asian (betel quid, areca nut, gutka, naswar) practices']))+
    '<div class="card"><h2>Reset</h2><p class="help">Clears saved demo cases, outreach status, settings and the log in this browser.</p><button class="btn d" onclick="if(confirm(\'Reset all demo data in this browser?\')){resetDemo()}">Reset demo data</button></div>';
}
function govPilot(){
  return gc('Proposed 6-month pilot in Abu Dhabi',ul(['Sites: 2 to 3 primary care centres or dental clinics serving areas with high betel-quid, smokeless-tobacco or dokha use, plus one specialist oral medicine service for tele-review','Month 0 to 1: ethics, data-sharing agreement, local verification sample (about 300 to 500 people with specialist examination) for the site trust check','Month 2 to 6: supervised use by trained screeners; specialist reviews every flagged case and a random sample of routine ones','Inclusion: adults attending adult comprehensive screening or targeted outreach; children through the Well-Child Visit route only']))+
    gc('Pilot measures',ul(['Completed screenings and reach by segment','Referral completion and time to specialist','Timely attendance, recall and follow-up completion','Confirmed OPMD and cancer among referrals (PPV), stage at diagnosis','Missed lesions found at recall (false negatives)','Clinician agreement and override reasons','Calibration (Brier, calibration error) and local AUC','Cessation enrolment; user trust and usability']))+
    gc('Roadmap','<ol class="path"><li><b>Now: prototype</b><span class="help">Full workflow, simulator, published model connection contract</span></li><li><b>Connect the trained model</b><span class="help">Hosted inference server with the 5-fold ensemble and Grad-CAM</span></li><li><b>Local validation and calibration</b><span class="help">Site trust check on an Abu Dhabi verification sample</span></li><li><b>Supervised pilot</b><span class="help">HIE integration, SMS and WhatsApp gateway, specialist tele-review</span></li><li><b>Retrain and scale</b><span class="help">Consented local annotations become lesion masks for fine-tuning; regulatory submission</span></li></ol>')+
    gc('Path to sustainability',ul(['Per-site subscription for public and private primary care networks, priced per screening','Lower cost per person than specialist visits: tele-review sends only those who need it','Fits existing programmes (adult comprehensive screening, Well-Child Visit) instead of creating a new one']));
}
